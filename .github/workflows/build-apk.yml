name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KS: ${{ secrets.FLIKK_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/flikkplay.p12"
            echo "FLIKK_KEYSTORE_FILE=$RUNNER_TEMP/flikkplay.p12" >> "$GITHUB_ENV"
            echo "Signing with private release key"
          else
            echo "::error::FLIKK_KEYSTORE secret ledu - Settings > Secrets lo add cheyyandi"
            exit 1
          fi

      - name: Build APK
        env:
          FLIKK_KEY_PASSWORD: ${{ secrets.FLIKK_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Flikk-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlikkPlay.apk
          echo "Signing certificate:"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs FlikkPlay.apk | grep -E "DN|SHA-256" || true
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Flikk Play v${{ env.APP_VERSION }}
          body: "Flikk Play — Made in India video player 🇮🇳. Kinda unna FlikkPlay.apk download chesi install cheyyandi."
          files: FlikkPlay.apk
          make_latest: "true"
