name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Flikk-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlikkPlay.apk
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Flikk Play v${{ env.APP_VERSION }}
          body: "Flikk Play — Made in India video player 🇮🇳. Kinda unna FlikkPlay.apk download chesi install cheyyandi."
          files: FlikkPlay.apk
          make_latest: "true"
